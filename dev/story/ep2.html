<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000;font-family:"Noto Kufi Arabic","Noto Sans Arabic","Noto Naskh Arabic",sans-serif}
#view{position:absolute;inset:0;overflow:hidden}

#night{position:absolute;inset:-200px -300px;background:linear-gradient(#0c1445,#27307a 60%,#4b4a9a);opacity:0}

#stars{position:absolute;inset:0;opacity:0}#stars i{position:absolute;border-radius:50%;background:#fff}
#moon{position:absolute;left:400px;top:60px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffef0,#f1e9b4);box-shadow:0 0 60px #fff8c0}

#sunW{position:absolute;left:960px;top:70px;width:150px;height:150px}

.cl{position:absolute;height:54px;background:#fff;border-radius:60px;opacity:.96;filter:drop-shadow(0 8px 0 rgba(130,190,230,.25))}
.cl:before,.cl:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl:before{width:52%;height:170%;top:-80%;left:14%}.cl:after{width:38%;height:130%;top:-50%;left:52%}
svg.L{position:absolute;left:-300px;top:0;width:1880px;height:720px;overflow:visible}
.sp{position:absolute;transform-origin:50% 100%;will-change:transform;user-select:none}
.sh{position:absolute;height:22px;border-radius:50%;background:rgba(30,70,20,.28);filter:blur(3px)}
#fx,#fxf{position:absolute;inset:0;pointer-events:none}
.p{position:absolute;will-change:transform}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(10,50,30,.28));pointer-events:none}

#dark{background:#4d5966!important}

</style></head><body>

 </div>

 <div class="card" id="end"><div class="burst" id="eb"></div><div class="t1">لعبنا في المطرة… واستحمّينا!</div><div class="t2">بعد اللعب في الطين، نغسل ونستحمى</div>
  <img class="tc" id="en" src="a/NART_pose_cheer.webp" style="height:300px;right:100px"><img class="tc" id="ebn" src="a/ZART_chick_happy.webp" style="height:180px;left:300px"><img class="tc" id="ew" src="a/ZART_frog_happy.webp" style="height:170px;left:70px"></div>
</div>
<script>
const ENV=window.__ENV||[];
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const eio=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,eout=k=>1-Math.pow(1-k,3),eback=k=>{const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const seg=(t,a,b,e=eio)=>e(cl((t-a)/(b-a),0,1));
// keyframes: [[time,value],...] with easing between
function kf(t,K,e=eio){if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++){if(t<=K[i][0])return lerp(K[i-1][1],K[i][1],e((t-K[i-1][0])/(K[i][0]-K[i-1][0])))}return K[K.length-1][1]}
const hop=(t,a,d,h)=>t>=a&&t<a+d?Math.sin((t-a)/d*Math.PI)*h:0;
// squash on landing at time a
const land=(t,a)=>t>=a&&t<a+.28?Math.sin((t-a)/.28*Math.PI):0;
// static scenery
{const tr=$('trees');[[-180,470,1],[330,468,.8],[820,455,.9],[1380,470,1.1]].forEach(([x,y,s])=>{tr.insertAdjacentHTML('beforeend',`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="0" width="18" height="60" rx="8" fill="#8a5a35"/><circle cx="0" cy="-30" r="52" fill="#4fa63a"/><circle cx="-34" cy="-6" r="34" fill="#5cb445"/><circle cx="36" cy="-8" r="36" fill="#449a32"/><circle cx="14" cy="-48" r="14" fill="#7cd35c" opacity=".7"/></g>`)});
 const fe=$('fence');let h='';for(let x=-300;x<1580;x+=46)h+=`<rect x="${x}" y="500" width="16" height="62" rx="7" fill="#fff6e3"/>`;h+=`<rect x="-300" y="516" width="1880" height="9" fill="#f3e3c2"/><rect x="-300" y="540" width="1880" height="9" fill="#f3e3c2"/>`;fe.innerHTML=h;
 let tf='';for(let i=0;i<70;i++){const x=-300+i*27+Math.sin(i*3)*8,hh=10+(i*7)%14;tf+=`<path d="M${x} 562 q4 -${hh} 8 0 q4 -${hh+6} 8 0" fill="#4c9a33"/>`}$('tufts').innerHTML=tf;
 let fl='';[[60,660,'#ff7fb0'],[210,690,'#ffd23f'],[420,668,'#fff'],[860,676,'#ff7fb0'],[1010,694,'#ffd23f'],[1190,664,'#fff'],[-120,680,'#ffd23f'],[1350,690,'#ff7fb0']].forEach(([x,y,c],i)=>{fl+=`<g class="fw" data-i="${i}" transform="translate(${x} ${y})"><rect x="-2" y="0" width="4" height="26" fill="#3f8a2b"/>${[0,72,144,216,288].map(a=>`<circle cx="${Math.cos(a*Math.PI/180)*9}" cy="${Math.sin(a*Math.PI/180)*9}" r="8" fill="${c}"/>`).join('')}<circle r="6" fill="#ffb300"/></g>`});$('flw').innerHTML=fl;
 let fg='';for(let i=0;i<40;i++){const x=-300+i*48+Math.sin(i*5)*12,hh=34+(i*13)%30;fg+=`<path d="M${x} 730 q10 -${hh} 16 -${hh+20} q4 ${hh} 10 ${hh+20}Z" fill="#3f8a2b"/>`}$('fgt').innerHTML=fg}
const SUBS=[[4.6,6.2,'أهلاً! أنا نبتة'],[13.3,15.8,'الدنيا بتمطر… نلبس إيه؟'],[20.6,23.1,'شربت! هتكبر دلوقتي'],[25.6,29.6,'بنشوف قوس قزح بـ إيه؟'],[29.8,30.8,'تحفة!'],[31.6,34.1,'كتكوت متوسخ! نحمّيه'],[40.2,41.8,'بقى نضيف خالص!'],[42.2,43.8,'كتكوت مبسوط'],[44.6,45.7,'برافو!']];
function put(el,cx,foot,h,o={}){const s=el.style;s.height=h+'px';s.left=cx+'px';s.top=(foot-h)+'px';s.opacity=o.op==null?1:o.op;
  s.transform=`translate(-50%,0) rotate(${o.rot||0}deg) scale(${(o.flip?-1:1)*(o.sx||1)},${o.sy||1})`}
function src(el,n){const u='a/'+n+'.webp';if(el.getAttribute('src')!==u)el.setAttribute('src',u)}
{let h='';for(let i=0;i<70;i++){const x=(i*173)%1280,y=(i*97)%330,r=1+(i%3);h+=`<i data-i="${i}" style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px"></i>`}$('stars').innerHTML=h}
// rainbow arcs, puddles, bath tub, leaf umbrella
{const C=['#ff5a5a','#ff9a3c','#ffd23f','#5fd35b','#39a9ff','#7b6cff'];$('rbg').innerHTML=C.map((c,i)=>`<path id="rb${i}" d="M ${300+i*22} 600 A ${420-i*22} ${400-i*22} 0 0 1 ${1140-i*22} 600" stroke="${c}" opacity=".85"/>`).join('');
 $('pud').innerHTML=[[200,616,110],[1010,618,130]].map(([x,y,w],i)=>`<g id="pd${i}"><ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w*.2}" fill="#6f5b45"/><ellipse cx="${x}" cy="${y-2}" rx="${w*.86}" ry="${w*.15}" fill="#8fc3e8"/><ellipse cx="${x-w*.3}" cy="${y-5}" rx="${w*.25}" ry="${w*.04}" fill="#d8efff"/></g>`).join('');
 $('tub').innerHTML=`<svg viewBox="0 0 240 120" width="240" height="120"><path d="M10 34 H230 Q226 104 190 110 H50 Q14 104 10 34Z" fill="#f5fbff" stroke="#9cc8e6" stroke-width="5"/><rect x="0" y="22" width="240" height="18" rx="9" fill="#d6ecfb" stroke="#9cc8e6" stroke-width="4"/><rect x="48" y="106" width="14" height="14" rx="5" fill="#9cc8e6"/><rect x="178" y="106" width="14" height="14" rx="5" fill="#9cc8e6"/><ellipse cx="120" cy="30" rx="108" ry="8" fill="#8fd0ff"/></svg>`;
 $('umb').innerHTML=`<svg viewBox="0 0 260 120" width="260" height="120"><path d="M10 92 Q40 4 130 4 Q220 4 250 92 Q220 78 190 92 Q160 78 130 92 Q100 78 70 92 Q40 78 10 92Z" fill="#4fae3a" stroke="#2f7d25" stroke-width="4"/><path d="M130 6 V92 M130 40 L60 80 M130 40 L200 80" stroke="#2f7d25" stroke-width="4" fill="none" opacity=".6"/><path d="M130 92 V118" stroke="#6b4226" stroke-width="7" stroke-linecap="round"/></svg>`}
const rc=$('rain').getContext('2d');
const SPL=[17.2,18.4,19.6],END=48.2,PX=200,FX=1010,TX=320;
window.setT=function(t){
  const f=Math.round(t*30),talk=ENV[f]||0,mouth=((ENV[f-1]||0)+talk+(ENV[f+1]||0))/3>.28;
  // ---------- cards ----------
  const tOut=seg(t,2.5,3.1);$('title').style.transform=`translateY(${-tOut*760}px)`;$('title').style.display=t<3.2?'flex':'none';
  $('tb').style.transform=`rotate(${t*14}deg)`;$('tt').style.transform=`scale(${seg(t,.15,.8,eback)})`;$('ts').style.transform=`scale(${seg(t,.6,1.1,eback)})`;
  $('tn').style.transform=`translateY(${(1-seg(t,.5,1.1,eback))*340-Math.abs(Math.sin(t*5))*14}px)`;$('tw').style.transform=`translateY(${(1-seg(t,.9,1.5,eback))*260-Math.abs(Math.sin(t*6))*20}px)`;
  const eIn=seg(t,END,END+.7,eout);$('end').style.transform=`translateY(${(1-eIn)*760}px)`;$('end').style.display=t>END-.1?'flex':'none';
  $('eb').style.transform=`rotate(${t*14}deg)`;$('en').style.transform=`translateY(${-Math.abs(Math.sin(t*6))*26}px)`;$('ebn').style.transform=`translateY(${-Math.abs(Math.sin(t*6+1))*20}px)`;$('ew').style.transform=`translateY(${-Math.abs(Math.sin(t*6+2))*24}px)`;
  // ---------- weather ----------
  const storm=kf(t,[[11.2,0],[12.6,1],[23,1],[24.6,0]]),rain=kf(t,[[12.8,0],[13.4,1],[22.8,1],[23.5,0]]),rb=seg(t,24.4,26.2,eout)*(1-seg(t,46.5,47.5));
  $('dark').style.opacity=storm*.45;$('stars').style.opacity=0;$('moon').style.opacity=0;$('night').style.opacity=0;$('dusk').style.opacity=0;
  $('sky').style.filter=`saturate(${1-storm*.6}) brightness(${1-storm*.25})`;
  $('sunW').style.transform=`translate(0,${storm*160}px)`;$('sunW').style.opacity=1-storm;
  $('rays').style.transform=`rotate(${t*10}deg)`;
  // storm clouds slide in over the sun
  const cg=kf(t,[[11,0],[12.6,1],[23,1],[24.6,0]]);
  $('c1').style.left=lerp(60+t*7,700,cg)+'px';$('c2').style.left=lerp(520-t*5,930,cg)+'px';$('c3').style.left=lerp(760+t*3,1040,cg)+'px';
  for(const c of ['c1','c2','c3']){$(c).style.filter=`brightness(${1-cg*.35})`;$(c).style.transform=`scale(${1+cg*.9})`}
  $('rbow').style.opacity=rb;['rb0','rb1','rb2','rb3','rb4','rb5'].forEach((id,i)=>{const e=$(id),L=e.getTotalLength();e.style.strokeDasharray=L;e.style.strokeDashoffset=L*(1-seg(t,24.4+i*.12,25.9+i*.12,eout))});
  // puddles grow with the rain
  ['pd0','pd1'].forEach(id=>{const k=kf(t,[[13,0],[16,1]]);$(id).setAttribute('transform',`translate(${id==='pd0'?PX:FX} 616) scale(${k} ${k}) translate(${-(id==='pd0'?PX:FX)} -616)`);$(id).style.opacity=k?1:0});
  // ---------- camera ----------
  const CAM=[[3,1.12,560,380],[6.4,1,640,360],[11,1,640,360],[12.4,1.02,640,340],[16.4,1.02,640,340],[17,1.35,420,470],[20.2,1.35,420,470],[20.6,1.3,680,450],[23.2,1.3,680,450],[24.2,1,640,330],[30.9,1,640,330],[31.6,1.3,330,450],[34.2,1.3,330,450],[35,1.35,450,450],[39.6,1.35,450,450],[40.2,1.45,360,460],[42,1.45,360,460],[43.4,1.15,560,410],[44,1.15,560,410],[44.6,1.08,600,380],[48,1.1,600,380]];
  const z=kf(t,CAM.map(c=>[c[0],c[1]])),cx=kf(t,CAM.map(c=>[c[0],c[2]])),cy=kf(t,CAM.map(c=>[c[0],c[3]]));
  let shx=0,shy=0;if(t>=12.2&&t<12.9){const k=1-(t-12.2)/.7;shx=Math.sin(t*80)*10*k;shy=Math.cos(t*60)*8*k}
  const fxw=cl(cx,640/z,1280-640/z),fyw=cl(cy,360/z,720-360/z);
  $('cam').style.transform=`translate(${640-fxw*z+shx}px,${360-fyw*z+shy}px) scale(${z})`;
  $('far').style.transform=`translateX(${(fxw-640)*.35}px)`;$('mid').style.transform=`translateX(${(fxw-640)*.18}px)`;$('fg').style.transform=`translateX(${-(fxw-640)*.5}px) translateY(${(z-1)*40}px)`;
  document.querySelectorAll('.fw').forEach(g=>{const i=+g.dataset.i,b=g.getAttribute('data-b')||g.getAttribute('transform');g.setAttribute('data-b',b);g.setAttribute('transform',b+` rotate(${Math.sin(t*2+i)*(6+storm*10)})`)});
  // ---------- Nabta ----------
  let nx=820,ny=600,nh=290,pose='NART_front',rot=0,sx=1,sy=1,umb=0;
  const say=(open,shut='NART_front')=>mouth?open:shut;
  if(t<4.5){pose='NART_pose_run';nx=lerp(-160,820,seg(t,3.1,4.5,eout));ny=600-Math.abs(Math.sin(t*16))*14;rot=6}
  else if(t<6.6){pose='NART_pose_wave';rot=Math.sin(t*7)*3}

  else if(t<15.9){pose=say('NART_face_surprised','NART_face_think');rot=Math.sin(t*4)*2}
  else if(t<20.4){pose='NART_face_happy';umb=seg(t,15.9,16.4,eback);ny=600-hop(t,16,.4,30);nx=820}
  else if(t<23.3){pose=say('NART_face_happy');umb=1;nx=lerp(820,780,seg(t,20.4,21))}

  else if(t<31.1){pose=t<25.5?'NART_pose_cheer':say('NART_face_surprised','NART_face_think');nx=780;ny=600-hop(t,24.5,.45,60);if(t>27.6&&t<29.7)pose='NART_face_think';if(t>29.7)pose='NART_pose_cheer'}

  else{pose=Math.floor(t*2.5)%2?'NART_pose_dance':'NART_pose_cheer';nx=840;ny=600-Math.abs(Math.sin(t*6))*34;rot=Math.sin(t*6)*4}
  sy*=1+talk*.06;sx*=1-talk*.025;rot+=talk*Math.sin(t*22)*2;
  src($('nab'),pose);put($('nab'),nx,ny,nh,{rot,sx,sy});
  const U=$('umb');U.style.opacity=umb;U.style.left=(nx-130)+'px';U.style.top=(ny-nh-98)+'px';U.style.transform=`scale(${umb}) rotate(${Math.sin(t*2)*4}deg)`;
  // ---------- chick ----------
