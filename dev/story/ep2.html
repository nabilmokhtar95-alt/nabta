<script>
const ENV=window.__ENV||[];
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const eio=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,eout=k=>1-Math.pow(1-k,3),eback=k=>{const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const seg=(t,a,b,e=eio)=>e(cl((t-a)/(b-a),0,1));
// keyframes: [[time,value],...] with easing between
function kf(t,K,e=eio){if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++){if(t<=K[i][0])return lerp(K[i-1][1],K[i][1],e((t-K[i-1][0])/(K[i][0]-K[i-1][0])))}return K[K.length-1][1]}
const hop=(t,a,d,h)=>t>=a&&t<a+d?Math.sin((t-a)/d*Math.PI)*h:0;
// squash on landing at time a
const land=(t,a)=>t>=a&&t<a+.28?Math.sin((t-a)/.28*Math.PI):0;
// static scenery
{const tr=$('trees');[[-180,470,1],[330,468,.8],[820,455,.9],[1380,470,1.1]].forEach(([x,y,s])=>{tr.insertAdjacentHTML('beforeend',`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="0" width="18" height="60" rx="8" fill="#8a5a35"/><circle cx="0" cy="-30" r="52" fill="#4fa63a"/><circle cx="-34" cy="-6" r="34" fill="#5cb445"/><circle cx="36" cy="-8" r="36" fill="#449a32"/><circle cx="14" cy="-48" r="14" fill="#7cd35c" opacity=".7"/></g>`)});
 const fe=$('fence');let h='';for(let x=-300;x<1580;x+=46)h+=`<rect x="${x}" y="500" width="16" height="62" rx="7" fill="#fff6e3"/>`;h+=`<rect x="-300" y="516" width="1880" height="9" fill="#f3e3c2"/><rect x="-300" y="540" width="1880" height="9" fill="#f3e3c2"/>`;fe.innerHTML=h;
 let tf='';for(let i=0;i<70;i++){const x=-300+i*27+Math.sin(i*3)*8,hh=10+(i*7)%14;tf+=`<path d="M${x} 562 q4 -${hh} 8 0 q4 -${hh+6} 8 0" fill="#4c9a33"/>`}$('tufts').innerHTML=tf;
 let fl='';[[60,660,'#ff7fb0'],[210,690,'#ffd23f'],[420,668,'#fff'],[860,676,'#ff7fb0'],[1010,694,'#ffd23f'],[1190,664,'#fff'],[-120,680,'#ffd23f'],[1350,690,'#ff7fb0']].forEach(([x,y,c],i)=>{fl+=`<g class="fw" data-i="${i}" transform="translate(${x} ${y})"><rect x="-2" y="0" width="4" height="26" fill="#3f8a2b"/>${[0,72,144,216,288].map(a=>`<circle cx="${Math.cos(a*Math.PI/180)*9}" cy="${Math.sin(a*Math.PI/180)*9}" r="8" fill="${c}"/>`).join('')}<circle r="6" fill="#ffb300"/></g>`});$('flw').innerHTML=fl;
 let fg='';for(let i=0;i<40;i++){const x=-300+i*48+Math.sin(i*5)*12,hh=34+(i*13)%30;fg+=`<path d="M${x} 730 q10 -${hh} 16 -${hh+20} q4 ${hh} 10 ${hh+20}Z" fill="#3f8a2b"/>`}$('fgt').innerHTML=fg}
// story: the tulip is thirsty -> the rain waters it -> the chick plays in the mud -> a bath -> the tulip blooms
const SUBS=[[4.6,6.2,'أهلاً! أنا نبتة'],[7.2,9.7,'الزرع عطشان! نسقيه'],[19.0,21.5,'شربت! هتكبر دلوقتي'],[23.2,24.2,'تحفة!'],[25.6,28.1,'كتكوت متوسخ! نحمّيه'],[34.0,35.6,'بقى نضيف خالص!'],[36.0,37.6,'كتكوت مبسوط'],[38.4,39.5,'برافو!']];
function put(el,cx,foot,h,o={}){const s=el.style;s.height=h+'px';s.left=cx+'px';s.top=(foot-h)+'px';s.opacity=o.op==null?1:o.op;
  s.transform=`translate(-50%,0) rotate(${o.rot||0}deg) scale(${(o.flip?-1:1)*(o.sx||1)},${o.sy||1})`}
function src(el,n){const u='a/'+n+'.webp';if(el.getAttribute('src')!==u)el.setAttribute('src',u)}
// a sprite whose picture changes cross-fades for ~0.12s instead of snapping
function sprite(A,B,F,t){const a=F(t);src(A,a.pose);put(A,a.x,a.y,a.h,a);let old=null,n=0;
  for(const d of [.03,.06,.09,.12]){const b=F(t-d);if(b.pose!==a.pose){old=old||b.pose;n++}}
  if(old){src(B,old);put(B,a.x,a.y,a.h,{...a,op:(a.op==null?1:a.op)*n/4})}else B.style.opacity=0;return a}
const LIT=['#ff5a5a','#ff9a3c','#ffd23f','#5fd35b','#39a9ff','#7b6cff'];
{$('rbg').innerHTML=LIT.map((c,i)=>`<path id="rb${i}" d="M ${300+i*22} 600 A ${420-i*22} ${400-i*22} 0 0 1 ${1140-i*22} 600" stroke="${c}" opacity=".8"/>`).join('');
 $('pud').innerHTML=[[200,616,120],[1000,618,120]].map(([x,y,w],i)=>`<g id="pd${i}"><ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w*.18}" fill="#7a6248"/><ellipse cx="${x}" cy="${y-2}" rx="${w*.88}" ry="${w*.135}" fill="#9fd0ef"/><ellipse cx="${x-w*.3}" cy="${y-5}" rx="${w*.22}" ry="${w*.035}" fill="#e3f4ff"/><g class="rip" data-x="${x}" data-y="${y-2}" data-w="${w*.8}"></g></g>`).join('');
 $('tub').innerHTML=`<svg viewBox="0 0 240 120" width="240" height="120"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9ecf9"/></linearGradient></defs><path d="M10 34 H230 Q226 104 190 110 H50 Q14 104 10 34Z" fill="url(#tg)" stroke="#9cc8e6" stroke-width="5"/><rect x="0" y="22" width="240" height="18" rx="9" fill="#eaf6ff" stroke="#9cc8e6" stroke-width="4"/><rect x="48" y="106" width="14" height="14" rx="5" fill="#9cc8e6"/><rect x="178" y="106" width="14" height="14" rx="5" fill="#9cc8e6"/><ellipse cx="120" cy="30" rx="108" ry="8" fill="#8fd0ff"/></svg>`;
 $('umb').innerHTML=`<svg viewBox="0 0 260 130" width="260" height="130"><defs><radialGradient id="lg" cx=".5" cy=".2" r=".9"><stop offset="0" stop-color="#7fd35f"/><stop offset="1" stop-color="#3f9a2e"/></radialGradient></defs><path d="M8 96 Q30 8 130 6 Q230 8 252 96 Q222 80 192 94 Q162 80 130 94 Q98 80 68 94 Q38 80 8 96Z" fill="url(#lg)" stroke="#2f7d25" stroke-width="3"/><path d="M130 8 V94 M130 44 Q95 60 62 86 M130 44 Q165 60 198 86 M130 24 Q105 34 84 52 M130 24 Q155 34 176 52" stroke="#2f7d25" stroke-width="3" fill="none" opacity=".55"/><path d="M130 94 V126" stroke="#6b4226" stroke-width="7" stroke-linecap="round"/></svg>`}
// soft storm clouds: overlapping shaded puffs on a canvas
const cc=$('cld').getContext('2d');
// each cloud: a big round body, smaller puffs either side, a flat soft bottom
const CLD=[[120,150,1.15],[520,110,1.4],[900,170,1.1],[1260,120,1.35],[1640,160,1.2]].map(([x,y,s],c)=>({x,y,s,c,p:[[0,-30,70],[-70,0,52],[70,-5,58],[-125,22,38],[125,20,42],[-30,18,55],[35,20,55]]}));
function clouds(k,t){cc.clearRect(0,0,1880,720);if(k<=0)return;cc.save();cc.filter='blur(3px)';
  for(const C of CLD){const side=C.x<940?-1:1,ox=C.x+side*(1-k)*1000+Math.sin(t*.25+C.c)*18,oy=C.y-(1-k)*50;
    for(const [dx,dy,r0] of C.p){const r=r0*C.s,x=ox+dx*C.s,y=oy+dy*C.s;
      const g=cc.createRadialGradient(x-r*.25,y-r*.5,r*.1,x,y+r*.1,r*1.05);g.addColorStop(0,`rgba(246,249,252,${k})`);g.addColorStop(.55,`rgba(196,207,220,${k})`);g.addColorStop(1,`rgba(160,174,192,${.95*k})`);
      cc.fillStyle=g;cc.beginPath();cc.arc(x,y,r,0,Math.PI*2);cc.fill()}
    cc.fillStyle=`rgba(160,174,192,${.95*k})`;cc.beginPath();cc.ellipse(ox,oy+40*C.s,150*C.s,22*C.s,0,0,Math.PI*2);cc.fill()}
  cc.restore()}
// rain: three depths of soft streaks, evenly scattered (golden-ratio spacing, so no stripes)
const rc=$('rain').getContext('2d'),DROPS=[];{for(let i=0;i<120;i++){const d=i%3;DROPS.push({u:(i*0.6180339)%1,v:(i*0.7548776)%1,d,sp:[520,760,1000][d],len:[12,18,26][d],a:[.3,.42,.55][d],w:[1,1.3,1.7][d]})}}
function rainDraw(k,t){rc.clearRect(0,0,1280,720);if(k<=0)return;const n=Math.round(DROPS.length*k);
  for(let i=0;i<n;i++){const p=DROPS[i],y=((p.v*820+t*p.sp)%820)-60,x=((p.u*1380-y*.12)%1380+1380)%1380-50;
    const g=rc.createLinearGradient(x,y,x-p.len*.12,y+p.len);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,`rgba(235,245,255,${p.a})`);
    rc.strokeStyle=g;rc.lineWidth=p.w;rc.lineCap='round';rc.beginPath();rc.moveTo(x,y);rc.lineTo(x-p.len*.12,y+p.len);rc.stroke()}}
const SPL=[15.4,16.5],END=41.8,PX=200,TX=320,TUL=640;
const ENVF=f=>ENV[f]||0,mouthAt=t=>{const f=Math.round(t*30);return(ENVF(f-1)+ENVF(f)+ENVF(f+1))/3>.28};
// ---------- Nabta ----------
function NAB(t){let x=820,y=600,h=290,pose='NART_front',rot=0,sx=1,sy=1,umb=0;const say=(o,c='NART_front')=>mouthAt(t)?o:c;
  if(t<4.5){pose='NART_pose_run';x=lerp(-160,860,seg(t,3.1,4.5,eout));y=600-Math.abs(Math.sin(t*16))*14;rot=6}
  else if(t<6.4){pose='NART_pose_wave';rot=Math.sin(t*7)*3}
  else if(t<7.1){pose='NART_pose_walk';x=lerp(860,800,seg(t,6.4,7.1));y=600-Math.abs(Math.sin(t*14))*8}
  else if(t<9.8){pose='NART_face_sad';x=800;rot=Math.sin(t*3)*2}
  else if(t<11.4){pose='NART_face_think';x=800}
  else if(t<12.4){pose='NART_face_surprised';x=800;y=600-hop(t,11.5,.35,46)}
  else if(t<18.6){pose='NART_face_happy';x=800;umb=seg(t,12.2,12.7,eback);y=600-hop(t,12.3,.4,28);rot=Math.sin(t*1.6)*2}
  else if(t<21.6){pose=say('NART_face_happy');x=800;umb=1-seg(t,18.4,18.9);if(t>19)y=600-hop(t,21,.4,40)}
  else if(t<24.6){pose=t<22.6?'NART_face_surprised':'NART_pose_cheer';x=800;y=600-hop(t,22.7,.45,60)}
  else if(t<25.4){pose='NART_face_surprised';x=lerp(800,430,seg(t,24.6,25.4));y=600-Math.abs(Math.sin(t*14))*10}
  else if(t<28.3){pose=say('NART_face_surprised');x=430}
  else if(t<29.1){pose='NART_pose_walk';x=lerp(430,570,seg(t,28.3,29.1));y=600-Math.abs(Math.sin(t*14))*8}
  else if(t<33.6){pose='NART_pose_water';x=570;rot=-10+Math.sin(t*6)*4}

  else{pose=Math.floor(t*2.5)%2?'NART_pose_dance':'NART_pose_cheer';x=840;y=600-Math.abs(Math.sin(t*6))*34;rot=Math.sin(t*6)*4}
  const tk=ENVF(Math.round(t*30));sy*=1+tk*.06;sx*=1-tk*.025;rot+=tk*Math.sin(t*22)*2;
  sy*=1+Math.sin(t*2.6)*.012;   // breathing

// ---------- chick ----------
function CHK(t){let pose='ZART_chick_idle',x=-120,y=600,h=165,rot=0,sx=1,sy=1,op=1;
  if(t<3.5)op=0;
  else if(t<6.4){pose=Math.floor(t*3)%2?'ZART_chick_happy':'ZART_chick_idle';x=lerp(-200,500,seg(t,3.5,5.2,eout));y=600-Math.abs(Math.sin(t*9))*36}

  else if(t<14.6){pose='ZART_chick_happy';x=lerp(500,905,seg(t,12.2,12.9));y=600-hop(t,12.25,.5,60)}   // runs under the leaf
  else if(t<17.6){pose=t>=SPL[1]?'ZART_chick_dirty':'ZART_chick_happy';x=kf(t,[[14.6,905],[15.4,PX]]);y=600-hop(t,14.8,.6,100)-hop(t,15.9,.6,90);
    SPL.forEach(a=>{const l=land(t,a);if(l){sy=1-l*.3;sx=1+l*.25}})}
  else if(t<28.3){pose='ZART_chick_dirty';x=PX+(t>17.6&&t<19?Math.sin(t*3)*16:0);y=600-(t>22.6&&t<23.6?hop(t,22.7,.4,40):0);if(t>24.8&&t<25.6)rot=Math.sin(t*34)*8}
